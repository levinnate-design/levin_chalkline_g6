<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="320">
  <!-- Poster Outer Frame -->
  <rect x="5" y="5" width="290" height="390" rx="14" fill="#fdfbf7" stroke="#003477" stroke-width="6"/>
  <rect x="15" y="15" width="270" height="370" rx="8" fill="#fff9ea" stroke="#ff8c0f" stroke-width="2"/>

  <!-- Vintage Header Banner -->
  <rect x="25" y="30" width="250" height="48" rx="6" fill="#003477"/>
  <text x="150" y="52" fill="#ffffff" font-family="'Poppins', sans-serif" font-size="18" font-weight="700" text-anchor="middle">VISIT MESOPOTAMIA!</text>
  <text x="150" y="70" fill="#2de2d6" font-family="'Noto Sans SC', sans-serif" font-size="12" font-weight="600" text-anchor="middle">欢迎来到美索不达米亚！</text>

  <!-- Illustration Area: Sun, Ziggurat, River -->
  <!-- Sun -->
  <circle cx="230" cy="115" r="22" fill="#ffb347" opacity="0.9"/>
  
  <!-- Ziggurat Steps -->
  <!-- Base Tier -->
  <polygon points="50,230 250,230 230,185 70,185" fill="#c49b66" stroke="#5c3818" stroke-width="2"/>
  <!-- Middle Tier -->
  <polygon points="75,185 225,185 210,150 90,150" fill="#d8b17b" stroke="#5c3818" stroke-width="2"/>
  <!-- Top Tier / Shrine -->
  <polygon points="105,150 195,150 185,125 115,125" fill="#ebc894" stroke="#5c3818" stroke-width="2"/>
  <rect x="135" y="110" width="30" height="15" fill="#38a3a5" stroke="#003477" stroke-width="2"/>
  <!-- Central Grand Stairway -->
  <polygon points="135,230 165,230 155,125 145,125" fill="#936639"/>

  <!-- Curving Tigris/Euphrates River -->
  <path d="M15,245 Q90,225 160,250 T285,240 L285,300 L15,300 Z" fill="#38a3a5"/>
  <path d="M15,260 Q90,240 160,265 T285,255" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.6"/>
  <text x="70" y="280" fill="#ffffff" font-family="'Source Sans 3', sans-serif" font-size="11" font-weight="700">Tigris River 🌊</text>
  <text x="195" y="285" fill="#ffffff" font-family="'Source Sans 3', sans-serif" font-size="11" font-weight="700">Euphrates River 🌊</text>

  <!-- Highlight Badge / Inventions -->
  <rect x="30" y="315" width="115" height="48" rx="6" fill="#ebf7fd" stroke="#0087ff" stroke-width="1.5"/>
  <text x="87" y="333" fill="#003477" font-family="'Source Sans 3', sans-serif" font-size="11" font-weight="700" text-anchor="middle">⚡ Smart Invention</text>
  <text x="87" y="351" fill="#ff8c0f" font-family="'Source Sans 3', sans-serif" font-size="12" font-weight="700" text-anchor="middle">See the Wheel!</text>

  <rect x="155" y="315" width="115" height="48" rx="6" fill="#fdf2e9" stroke="#ff8c0f" stroke-width="1.5"/>
  <text x="212" y="333" fill="#003477" font-family="'Source Sans 3', sans-serif" font-size="11" font-weight="700" text-anchor="middle">🏛️ Great Wonder</text>
  <text x="212" y="351" fill="#2d6a4f" font-family="'Source Sans 3', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Climb a Ziggurat!</text>

  <!-- Tagline at bottom -->
  <text x="150" y="378" fill="#5c677d" font-family="'Source Sans 3', sans-serif" font-size="10" font-style="italic" text-anchor="middle">"Land of two wild rivers & the world's first cities"</text>
</svg>
